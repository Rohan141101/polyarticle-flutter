name: polyarticle_flutter
description: "PolyArticle - News feed app converted from React Native to Flutter."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # Secure storage (replaces expo-secure-store)
  flutter_secure_storage: ^9.2.2

  # Persistent settings (replaces AsyncStorage)
  shared_preferences: ^2.3.2

  # Device info (replaces expo-device)
  device_info_plus: ^10.1.2

  # Share (replaces Share API)
  share_plus: ^10.1.4

  # URL launcher (replaces Linking.openURL)
  url_launcher: ^6.3.1

  # Google Mobile Ads (replaces react-native-google-mobile-ads)
  google_mobile_ads: ^5.2.0

  # Image caching
  cached_network_image: ^3.4.1

  # .env file loading
  flutter_dotenv: ^5.2.1

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/
