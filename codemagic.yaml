workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rohan.flashfeed2
      vars:
        FLUTTER_SWIFT_PACKAGE_MANAGER_ENABLED: "false"
    scripts:
      - name: Disable Swift Package Manager
        script: printf '{"enable-swift-package-manager":false}' > $HOME/.flutter_settings
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rohanbanodiya@gmail.com
