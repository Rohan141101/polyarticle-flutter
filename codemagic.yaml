workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.24.3
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rohan.flashfeed2
    scripts:
      - name: Create .env file
        script: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_ADMOB_BANNER_ID=${ADMOB_ANDROID_BANNER_ID}
          EXPO_PUBLIC_ADMOB_IOS_BANNER_ID=${ADMOB_IOS_BANNER_ID}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID=${ADMOB_ANDROID_INTERSTITIAL_ID}
          EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL_ID=${ADMOB_IOS_INTERSTITIAL_ID}
          EXPO_PUBLIC_ADMOB_NATIVE_ID=${ADMOB_ANDROID_NATIVE_ID}
          EXPO_PUBLIC_ADMOB_IOS_NATIVE_ID=${ADMOB_IOS_NATIVE_ID}
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rohanbanodiya@gmail.com
