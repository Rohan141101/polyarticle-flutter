workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rohan.flashfeed2
    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Patch Podfile to disable Swift Package Manager
        script: sed -i '' '1s/^/ENV["FLUTTER_SWIFT_PACKAGE_MANAGER_ENABLED"] = "false"\n/' ios/Podfile
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - rohanbanodiya@gmail.com
